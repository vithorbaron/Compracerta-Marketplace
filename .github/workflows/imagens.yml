name: Enviar imagens dos produtos

on:
  workflow_dispatch:

permissions: {}

jobs:
  imagens:
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Baixar imagens de origem
        run: |
          mkdir imagens
          jq -c '.[]' infra/imagens/imagens-origem.json | while read -r item; do
            id=$(echo "$item" | jq -r '.id')
            url=$(echo "$item" | jq -r '.url')
            case "$url" in https://images.unsplash.com/*) ;; *) echo "URL ignorada: $id"; continue ;; esac
            curl -sSfL --max-time 60 --max-filesize 5000000 "$url" -o "imagens/produto-${id}.jpg"
          done
          ls imagens | wc -l

      - name: Remover metadados das imagens (EXIF, GPS, autor, aparelho)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl
          for f in imagens/*.jpg; do
            [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' ')" = "ffd8ff" ] || { echo "Não é JPEG: $f"; exit 1; }
          done
          exiftool -q -all= -overwrite_original imagens/*.jpg
          # Confere: nenhuma imagem pode sair com metadados.
          exiftool -j -q -EXIF:all -XMP:all -IPTC:all -GPS:all -Photoshop:all imagens/*.jpg \
            | jq -e 'all(.[]; keys == ["SourceFile"])' > /dev/null \
            || { echo "Ainda há metadados nas imagens"; exit 1; }

      - name: Entrar no Azure (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enviar para o Blob Storage
        env:
          ARMAZENAMENTO: ${{ vars.AZURE_ARMAZENAMENTO }}
        run: |
          az storage blob upload-batch \
            --account-name "$ARMAZENAMENTO" \
            --destination produtos --source imagens \
            --pattern "produto-*.jpg" --content-type image/jpeg \
            --auth-mode login --overwrite
