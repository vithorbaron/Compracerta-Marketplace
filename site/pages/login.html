<!doctype html>
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://*.blob.core.windows.net https://images.unsplash.com; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — CompraCerta</title>
<meta name="description" content="Entre na sua conta CompraCerta.">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<script src="../js/seguranca-log.js"></script>
<script src="../js/armazenamento.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>

<p class="study-banner">Projeto acadêmico — ambiente de demonstração.</p>

<header class="auth-header">
  <div class="container">
    <a class="logo" href="../index.html">Compra<span>Certa</span></a>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <p class="auth-eyebrow">Entrar</p>
    <h1>Bem-vindo de volta</h1>
    <p class="auth-sub">Entre com seu usuário ou e-mail para continuar comprando.</p>

    <div class="form-banner success" id="formSuccess" role="status"></div>
    <div class="form-banner error" id="formError" role="alert"></div>


    <form id="formLogin" novalidate>
      <div class="field">
        <label for="identificador">Usuário ou e-mail</label>
        <input class="input" type="text" id="identificador" name="identificador" autocomplete="username" required maxlength="254" placeholder="voce@email.com">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input class="input" type="password" id="senha" name="senha" autocomplete="current-password" required maxlength="128" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
    </form>

    <p class="auth-footer">Não tem conta? <a href="cadastro.html">Criar conta grátis</a></p>

    <div class="auth-disclaimer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <span>Ambiente de demonstração acadêmica.</span>
    </div>
  </div>
</main>

<script src="../js/validacao.js"></script>
<script src="../js/login.js"></script>

</body>
</html>
