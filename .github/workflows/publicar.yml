name: Publicar aplicação

on:
  push:
    branches: [main]
    paths: ["site/**", "api/**", ".github/workflows/publicar.yml", ".github/workflows/verificar.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  # Só publica se a verificação de segurança passar.
  verificar:
    permissions:
      contents: read
    uses: ./.github/workflows/verificar.yml

  publicar:
    needs: verificar
    # Sem as variáveis do Azure configuradas, a publicação é pulada em vez de falhar.
    if: vars.AZURE_SITE != ''
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Montar pacote (API + site)
        run: |
          mkdir pacote
          cp -r api/app api/requirements.txt pacote/
          cp -r site pacote/site
          find pacote -name "__pycache__" -prune -exec rm -rf {} +
          cd pacote && zip -qr ../pacote.zip .

      - name: Entrar no Azure (OIDC, sem segredo guardado)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar no App Service
        env:
          GRUPO: ${{ vars.AZURE_GRUPO }}
          SITE: ${{ vars.AZURE_SITE }}
        run: |
          az webapp deploy --resource-group "$GRUPO" --name "$SITE" \
            --src-path pacote.zip --type zip --async false
